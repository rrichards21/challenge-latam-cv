name: 'Continuous Integration'

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi

      - name: Download Data from Drive
        run: |
          gdown "https://drive.google.com/drive/folders/1XEU1eUnQOf5alRipPJ37myGn2C2jeZmY" -O data --folder

      - name: Verify Data
        run: |
          ls -R data

      - name: Run API tests
        run: |
          make api-test

      - name: Run Model tests
        run: |
          make model-test